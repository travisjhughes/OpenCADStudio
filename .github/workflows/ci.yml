name: Tests

# Probe branch only (never merged): runs the -PDFIMPORT script tests on
# Windows with their output.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: probe, the module in parallel
        env:
          LC_ALL: C
        run: cargo test --locked --lib -- pdf_import::pdfimport_tests
        continue-on-error: true
      - name: probe, the whole library in parallel
        env:
          LC_ALL: C
        run: cargo test --locked --lib
        continue-on-error: true
